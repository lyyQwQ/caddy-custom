name: Build Caddy image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/caddy-custom

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build verification image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: caddy-custom:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Caddy version and modules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm caddy-custom:verify caddy version | tee /tmp/caddy-version.txt
          grep -q '^v2\.11\.7 ' /tmp/caddy-version.txt
          docker run --rm caddy-custom:verify caddy list-modules > /tmp/caddy-modules.txt
          for module in \
            http.handlers.cache \
            caddy.logging.encoders.transform \
            dns.providers.cloudflare \
            http.encoders.br \
            http.handlers.rate_limit; do
            grep -qx "$module" /tmp/caddy-modules.txt
          done

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
